[workspace]
resolver = "3"
members = [
  "crates/fishbowl",
  "crates/fishbowl-agents",
  "crates/fishbowl-audit",
  "crates/fishbowl-courier",
  "crates/fishbowl-creds",
  "crates/fishbowl-gateway",
  "crates/fishbowl-image",
  "crates/fishbowl-runtime",
]
# The gateway and the courier only build for Linux; both are compiled into the image.
default-members = [
  "crates/fishbowl",
  "crates/fishbowl-agents",
  "crates/fishbowl-audit",
  "crates/fishbowl-creds",
  "crates/fishbowl-image",
  "crates/fishbowl-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lexoliu/fishbowl"
authors = ["Lexo Liu <me@lexo.cool>"]
rust-version = "1.90"

[workspace.dependencies]
fishbowl-runtime = { path = "crates/fishbowl-runtime", version = "0.1.0" }
fishbowl-image = { path = "crates/fishbowl-image", version = "0.1.0" }
fishbowl-audit = { path = "crates/fishbowl-audit", version = "0.1.0" }
fishbowl-agents = { path = "crates/fishbowl-agents", version = "0.1.0" }
fishbowl-courier = { path = "crates/fishbowl-courier", version = "0.1.0" }
fishbowl-creds = { path = "crates/fishbowl-creds", version = "0.1.0" }
fishbowl-gateway = { path = "crates/fishbowl-gateway", version = "0.1.0" }

anyhow = "1.0"
askama = "0.16"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "net", "time", "signal"] }
etherparse = "0.19"
getrandom = "0.4"
hickory-proto = "0.26"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
inquire = "0.9"
jiff = { version = "0.2", features = ["serde"] }
netlink-packet-core = "0.9"
netlink-packet-netfilter = "0.4"
netlink-sys = { version = "0.9", features = ["tokio_socket"] }
nix = { version = "0.30", features = ["net", "socket"] }
procfs = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
security-framework = "3"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "getrandom", "rand_core", "std"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
toml = "0.9"
webpki-roots = "1"
toml_edit = "0.24"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
