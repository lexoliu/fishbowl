name: Release

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # The fishbowl tag's downstream work — its dist build and its image tagging — is
  # dispatched from below, since a GITHUB_TOKEN release fires no tag-triggered runs.
  actions: write

jobs:
  release-plz:
    name: release-plz
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN. Trusted publishing is
      # configured per crate on crates.io; a crate that has never been
      # published cannot be configured, so the step stays non-blocking
      # until the first `cargo publish` bootstrap lands it.
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
        continue-on-error: true
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      # A tag this token pushes fires nothing downstream, so the work that used to
      # hear it is dispatched explicitly: the dist build for the new release and the
      # image tag a binary of that version pulls.
      - name: Fan out the fishbowl release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "fishbowl") | .tag // ("fishbowl-v" + .version)' <<< "$RELEASES")
          if [ -n "$tag" ]; then
            gh workflow run fishbowl-v-release.yml -f "tag=$tag"
            gh workflow run image.yml -f "ref=$tag"
          fi
