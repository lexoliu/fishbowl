[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# fishbowl drives apple/container, which exists only on Apple silicon.
targets = ["aarch64-apple-darwin"]
# release-plz tags every published crate — fishbowl-creds-v*, fishbowl-gateway-v* and
# the rest included — but only the CLI ships to users, so dist only hears its tags.
tag-namespace = "fishbowl-v"
# release-plz has already opened the GitHub Release by the time the tag lands; dist
# attaches artifacts to that release instead of racing to create a second one.
create-release = false
# A check that the release plan still makes sense, run on pull requests.
pr-run-mode = "plan"
# release-plz pushes tags with GITHUB_TOKEN, which cannot fire a tag-triggered
# workflow; release-plz.yml dispatches this one by tag instead, and the same
# dispatch input is the manual re-release path.
dispatch-releases = true
